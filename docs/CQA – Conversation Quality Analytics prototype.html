<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>CQA · Conversation Quality Analytics</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f6f7f9;--sf:#fff;--tx:#14182b;--mu:#6a7088;--bd:#e3e6ee;--ac:#4f46e5;--acs:#eceafd;--ok:#12805c;--oks:#e2f5ec;--wn:#a35d00;--wns:#fdf0d8;--rd:#c4281c;--rds:#fde7e5;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1019;--sf:#171a27;--tx:#eceef6;--mu:#9299b3;--bd:#2a2f44;--acs:#25264d;--ok:#4cc998;--oks:#10382a;--wn:#f0b45a;--wns:#3d2e10;--rd:#ff7d70;--rds:#40191a;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--tx);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;min-height:100vh}
nav{width:210px;background:var(--sf);border-right:1px solid var(--bd);padding:16px 10px;position:sticky;top:0;height:100vh;flex:none}
nav h1{font-size:15px;margin:0 8px 16px;display:flex;gap:8px;align-items:center}nav h1 i{width:22px;height:22px;border-radius:6px;background:var(--ac);display:inline-block}
nav a{display:flex;justify-content:space-between;padding:7px 10px;border-radius:6px;color:var(--mu);cursor:pointer;font-weight:500}nav a:hover{background:var(--bg)}nav a.on{background:var(--acs);color:var(--ac)}
main{flex:1;padding:24px 28px;min-width:0;max-width:1280px}h2{font-size:20px;margin:0 0 4px}h3{font-size:14px;margin:0 0 10px}.sub{color:var(--mu);margin:0 0 18px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:16px}.grid{display:grid;gap:12px}.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.big{font-size:26px;font-weight:650;letter-spacing:-.02em}.mu{color:var(--mu)}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}
button,select,input,textarea{font:inherit;color:var(--tx);background:var(--sf);border:1px solid var(--bd);border-radius:6px;padding:6px 10px}textarea{width:100%}button{cursor:pointer;font-weight:500}button:hover{border-color:var(--ac)}button.p{background:var(--ac);color:#fff;border-color:var(--ac)}button.d{color:var(--rd)}:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
table{width:100%;border-collapse:collapse}th{text-align:left;color:var(--mu);font-weight:500;font-size:12px}td,th{padding:9px 10px;border-bottom:1px solid var(--bd)}tr.c{cursor:pointer}tr.c:hover{background:var(--bg)}.tw{overflow-x:auto}
.b{padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}.ok{background:var(--oks);color:var(--ok)}.wn{background:var(--wns);color:var(--wn)}.rd{background:var(--rds);color:var(--rd)}.ne{background:var(--bg);color:var(--mu)}
.split{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:14px;align-items:start}@media(max-width:900px){.split{grid-template-columns:1fr}nav{display:none}main{padding:16px}}
.msg{padding:8px 12px;border-radius:8px;margin:6px 0;max-width:88%;border:1px solid var(--bd);scroll-margin:80px}.msg.client{background:var(--bg)}.msg.op{background:var(--acs);margin-left:auto}.msg.sys{max-width:100%;text-align:center;color:var(--mu);font-size:12px;border:0}.msg small{color:var(--mu);display:block;font-size:11px}
.hl{outline:2px solid var(--wn);background:var(--wns)!important}.crit{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px 0;border-bottom:1px solid var(--bd)}.crit p{grid-column:1/-1;margin:2px 0;color:var(--mu)}
a.ev{color:var(--ac);cursor:pointer;text-decoration:underline}.bar{height:8px;background:var(--bg);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.modal{position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}.modal>div{background:var(--sf);border-radius:10px;padding:20px;width:480px;max-width:100%;max-height:90vh;overflow:auto}
label{display:block;margin:10px 0 3px;font-weight:500;font-size:13px}label+input,label+select{width:100%}.toast{position:fixed;bottom:20px;right:20px;background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:30}
</style></head><body>
<nav><h1><i></i>CQA</h1><div id="nv"></div></nav><main id="m"></main><div id="o"></div>
<script>
const $=s=>document.querySelector(s),LG={RU:'Russian',KZ:'Kazakh',EN:'English'};
const CL0=[
{id:'c1',n:'Rapport',d:'Greeting in client language and introduction',t:'yn',w:10,na:false},
{id:'c2',n:'Needs discovery',d:'Clarified missing details before answering',t:'yn',w:15,na:true},
{id:'c3',n:'Identification',d:'Identity verified before protected action',t:'yn',w:20,na:true},
{id:'c4',n:'Correct & complete consultation',d:'Answer or next step quality',t:'sc',w:20,na:true,s:[20,15,10,5,0]},
{id:'c5',n:'Empathy',d:'Polite, reacts to the specific problem',t:'yn',w:15,na:false},
{id:'c6',n:'Dialogue control & grammar',d:'Clarity, order, wait warnings',t:'sc',w:15,na:false,s:[10,7,4,0]},
{id:'c7',n:'Closing',d:'Summary or offer of help, goodbye',t:'yn',w:5,na:true},
{id:'c8',n:'Gross violations',d:'Insult, off-company paid offer, confidential leak',t:'yn',w:0,na:false,crit:true}];
const R=(a,e,t)=>({a,e,t});
const CV=[
{id:'p1-ru-001',ag:'Aliya S.',lg:'RU',ch:'chat',dt:'2026-11-05',tp:'Refund',ev:1,m:[['sys','00:00','Чат начат'],['client','00:05','Здравствуйте, хочу вернуть деньги за заказ №4521, товар пришёл повреждённый.'],['op','00:48','Здравствуйте! Меня зовут Алия. Сожалею о неудобствах. Подскажите ваш ИИН и номер заказа.'],['client','01:10','ИИН 900101300123, заказ 4521.'],['op','01:40','Спасибо, личность подтверждена. Оформила возврат, деньги поступят в течение 5 рабочих дней.'],['client','02:00','Хорошо, спасибо.'],['op','02:10','Обращайтесь, если будут вопросы. Всего доброго!']],
r:{c1:R('yes',2,'Greeted and introduced in the first reply.'),c2:R('na',1,'Order number and issue were stated upfront.'),c3:R('yes',4,'Identity confirmed before refund.'),c4:R(20,4,'Refund created with clear timeline.'),c5:R('yes',2,'Apologised for the specific damage.'),c6:R(10,4,'Clear, ordered replies.'),c7:R('yes',6,'Offered help and said goodbye.'),c8:R('no',6,'No gross violations found.')}},
{id:'p1-kz-014',ag:'Daniyar B.',lg:'KZ',ch:'chat',dt:'2026-11-05',tp:'Delivery',ev:1,m:[['client','00:03','Сәлем, тапсырысым қашан жеткізіледі?'],['op','03:20','Күте тұрыңыз.'],['op','03:45','Жақын арада келеді.'],['client','04:00','Нақты күнін айта аласыз ба? Тапсырыс 7788.'],['op','04:30','Білмеймін, курьерге жазыңыз.'],['sys','04:35','Чат оператормен жабылды']],
r:{c1:R('no',1,'No greeting or introduction; reply came after 3 minutes.'),c2:R('no',2,'Did not ask for the order number.'),c3:R('na',0,'Delivery status needs no identification.'),c4:R(5,4,'Vague hint only; no concrete next step.'),c5:R('no',4,'Client frustration ignored.'),c6:R(4,1,'Wait was not announced; client had to repeat.'),c7:R('no',5,'Chat closed without goodbye.'),c8:R('no',4,'No gross violations found.')}},
{id:'p2-en-031',ag:'Maria K.',lg:'EN',ch:'chat',dt:'2026-11-06',tp:'Technical issue',ev:0,m:[['client','00:02','Hi, the app crashes when I open my portfolio.'],['op','00:20',"Hello, I'm Maria from Freedom support. Which device and app version are you using?"],['client','00:45','iPhone 14, version 5.2.1'],['op','01:10',"Thanks. Please update to 5.2.3 and reinstall if it persists. I've also sent you the guide."],['client','01:40','It works now, thanks!'],['op','01:50','Glad to hear it. Anything else I can help with? Goodbye!']],
r:{c1:R('yes',1,'Greeted and introduced.'),c2:R('yes',1,'Asked device and version before answering.'),c3:R('na',0,'Troubleshooting needs no identification.'),c4:R(15,3,'Solved; minor detail (backup advice) skipped.'),c5:R('yes',1,'Polite and engaged with the crash.'),c6:R(7,3,'One long reply combined two steps.'),c7:R('yes',5,'Offered help and said goodbye.'),c8:R('no',5,'No gross violations found.')}},
{id:'v1-ru-002',ag:'Timur E.',lg:'RU',ch:'voice',dt:'2026-11-04',tp:'Service complaint',ev:1,dur:62,m:[['client','00:04','Ваш брокер три дня не отвечает, это безобразие!'],['op','00:15','Здравствуйте, Тимур. Не кричите, я не обязан отвечать мгновенно.'],['client','00:30','Вы мне хамите?'],['op','00:42','Если хотите, переведите мне лично, я вложу ваши деньги выгоднее.'],['client','00:55','Я вас записываю.']],
r:{c1:R('yes',1,'Greeted and gave name.'),c2:R('no',1,'Never asked what the client needed.'),c3:R('na',0,'No protected action requested.'),c4:R(0,3,'No substantive answer; off-company offer.'),c5:R('no',1,'Dismissive reaction to a complaint.'),c6:R(4,3,'Contradictory, confusing replies.'),c7:R('no',4,'Call ended without closing.'),c8:R('yes',3,'Offered to invest client money personally (off-company paid offer).')}}];
let S=load();function load(){try{const s=JSON.parse(localStorage.getItem('cqa1'));if(s)return s}catch(e){}return{cl:[{id:'k1',n:'Chat quality v1',d:'Freedom Broker standard checklist',lg:'All',tp:'Chat',c:CL0}],act:'k1',ap:[],ov:{},ran:{}}}
function sv(){try{localStorage.setItem('cqa1',JSON.stringify(S))}catch(e){}}
const AC=()=>S.cl.find(x=>x.id==S.act)||S.cl[0],isRan=c=>c.ev||S.ran[c.id];
// scoring
function res(cv,c){const o=(S.ov[cv.id]||{})[c.id];let r=cv.r[c.id];if(!r){r=c.t=='sc'?R(c.s[1]??c.s[0],1,'Simulated result for the new criterion.'):R('yes',1,'Simulated result for the new criterion.')}return{...r,orig:r.a,a:o?o.v:r.a,ovr:o}}
function calc(cv,cl){const rows=cl.map(c=>({c,r:res(cv,c)}));const sc=rows.filter(x=>!x.c.crit&&x.r.a!=='na');const W=sc.reduce((s,x)=>s+x.c.w,0);const f=W?100/W:0;
rows.forEach(x=>{if(x.c.crit||x.r.a==='na'||!W){x.pts=0;x.max=0;return}x.max=+(x.c.w*f).toFixed(4);x.frac=x.c.t=='sc'?x.r.a/x.c.s[0]:x.r.a=='yes'?1:0;x.pts=x.frac*x.max});
const tot=W?+sc.reduce((s,x)=>s+x.pts,0).toFixed(2):null;const flag=rows.some(x=>x.c.crit&&x.r.a=='yes');return{rows,tot,flag,f}}
function fin(cv){return calc(cv,AC().c)}const sb=v=>v==null?'ne':v>=80?'ok':v>=60?'wn':'rd';
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.append(d);setTimeout(()=>d.remove(),2200)}
// nav
let V='ov',CID=null,EDIT=null;const NAV=[['ov','Overview'],['cv','Conversations'],['cl','Checklists'],['ap','Appeals & review'],['st','Settings']];
function go(v,id){V=v;if(id!==undefined)CID=id;render()}
function render(){$('#nv').innerHTML=NAV.map(([k,l])=>`<a class="${V==k||(V=='ev'&&k=='cv')?'on':''}" onclick="go('${k}')">${l}${k=='ap'&&S.ap.some(a=>a.s=='pending')?`<span class="b wn">${S.ap.filter(a=>a.s=='pending').length}</span>`:''}</a>`).join('');$('#m').innerHTML=({ov,cv,ev,cl,ap,st})[V]();window.scrollTo(0,0)}
// overview
function ov(){const ds=CV.filter(isRan).map(c=>({c,k:fin(c)})),avg=ds.reduce((s,x)=>s+(x.k.tot||0),0)/(ds.length||1);
return`<h2>Overview</h2><p class="sub">Active checklist: ${AC().n}</p><div class="grid g4">
<div class="card"><div class="mu">Evaluated</div><div class="big">${ds.length}<span class="mu" style="font-size:14px"> / ${CV.length}</span></div></div>
<div class="card"><div class="mu">Average score</div><div class="big">${avg.toFixed(2)}</div></div>
<div class="card"><div class="mu">Critical violations</div><div class="big" style="color:var(--rd)">${ds.filter(x=>x.k.flag).length}</div></div>
<div class="card"><div class="mu">Pending appeals</div><div class="big" style="color:var(--wn)">${S.ap.filter(a=>a.s=='pending').length}</div></div></div>
<div class="grid g2" style="margin-top:12px"><div class="card"><h3>Score by conversation</h3>${ds.map(x=>`<div class="row sp" style="margin:8px 0"><span style="width:110px">${x.c.id}</span><div class="bar" style="flex:1"><i style="width:${x.k.tot||0}%"></i></div><b>${x.k.tot}</b></div>`).join('')}</div>
<div class="card"><h3>Language mix</h3>${Object.keys(LG).map(l=>{const n=CV.filter(c=>c.lg==l).length;return`<div class="row sp" style="margin:8px 0"><span style="width:80px">${LG[l]}</span><div class="bar" style="flex:1"><i style="width:${n/CV.length*100}%"></i></div><b>${n}</b></div>`}).join('')}</div></div>`}
// conversations
let F={q:'',lg:'',ch:''};
function cv(){const L=CV.filter(c=>(!F.lg||c.lg==F.lg)&&(!F.ch||c.ch==F.ch)&&(c.id+c.ag+c.tp).toLowerCase().includes(F.q.toLowerCase()));
return`<h2>Conversations</h2><p class="sub">Open a conversation to see its evaluation.</p><div class="row" style="margin-bottom:12px"><input id="q" placeholder="Search ID, agent, topic" value="${F.q}" oninput="F.q=this.value;fl()"><select onchange="F.lg=this.value;fl()"><option value="">All languages</option>${Object.keys(LG).map(l=>`<option ${F.lg==l?'selected':''}>${l}</option>`)}</select><select onchange="F.ch=this.value;fl()"><option value="">Chat + voice</option><option ${F.ch=='chat'?'selected':''}>chat</option><option ${F.ch=='voice'?'selected':''}>voice</option></select></div><div class="card tw" id="tb">${tbl(L)}</div>`}
function fl(){const q=$('#q').selectionStart;cv.call();$('#tb').innerHTML=tbl(CV.filter(c=>(!F.lg||c.lg==F.lg)&&(!F.ch||c.ch==F.ch)&&(c.id+c.ag+c.tp).toLowerCase().includes(F.q.toLowerCase())))}
function tbl(L){return`<table><tr><th>ID<th>Agent<th>Lang<th>Channel<th>Date<th>Status<th>Score<th>Critical</tr>${L.map(c=>{const k=fin(c),r=isRan(c);return`<tr class="c" onclick="go('ev','${c.id}')"><td><b>${c.id}</b><td>${c.ag}<td>${c.lg}<td>${c.ch}<td>${c.dt}<td><span class="b ${r?'ok':'ne'}">${r?'Evaluated':'Not evaluated'}</span><td>${r?`<span class="b ${sb(k.tot)}">${k.tot}</span>`:'—'}<td>${r&&k.flag?'<span class="b rd">Violation</span>':''}</tr>`}).join('')||'<tr><td colspan=8 class="mu">No conversations match these filters.</tr>'}</table>`}
// evaluation
function ev(){const c=CV.find(x=>x.id==CID),k=fin(c),r=isRan(c);
const aud=c.ch=='voice'?`<div class="row" style="margin-bottom:8px"><button onclick="toast('Playing (simulated)')">▶</button><input type="range" min="0" max="${c.dur}" value="0" style="flex:1" id="pl"><span class="mu">01:02</span></div>`:'';
const tr=c.m.map((m,i)=>`<div class="msg ${m[0]}" id="m${i}"><small>${m[0]} · ${m[1]}${c.ch=='voice'&&m[0]!='sys'?` · <a class="ev" onclick="seek(${i})">jump to audio</a>`:''}</small>${m[2]}</div>`).join('');
const ap=S.ap.filter(a=>a.cid==c.id);
return`<div class="row sp"><div><h2>${c.id} <span class="b ne">${c.lg}</span> <span class="b ne">${c.ch}</span></h2><p class="sub">${c.tp} · ${c.ag} · ${c.dt}</p></div><div class="row"><button onclick="go('cv')">Back</button><button class="p" onclick="run('${c.id}')">${r?'Re-evaluate':'Run evaluation'}</button></div></div>
<div class="split"><div class="card">${aud}<h3>Transcript</h3>${tr}</div><div>${r?`<div class="card"><div class="row sp"><div><div class="mu">Final score (checklist: ${AC().n})</div><div class="big">${k.tot}<span class="mu" style="font-size:14px"> / 100</span></div></div>${k.flag?'<span class="b rd">Critical violation</span>':'<span class="b ok">No critical violations</span>'}</div>
<p class="mu" style="margin:6px 0 0">${k.rows.some(x=>x.r.a==='na')?'N/A criteria excluded; weights rescaled by ×'+k.f.toFixed(3)+' so the maximum stays 100.':'All criteria applicable.'}</p></div>
<div class="card" style="margin-top:12px"><h3>Criteria</h3>${k.rows.map(x=>row(x,c)).join('')}</div>`:`<div class="card"><h3>Not evaluated yet</h3><p class="mu">Run the evaluation with the active checklist to see scores and evidence.</p></div>`}</div></div>`}
function row({c,r,pts,max},cv){const a=r.a,na=a==='na',l=c.crit?(a=='yes'?'Violation':'None'):na?'N/A':c.t=='sc'?a+' / '+c.s[0]:a=='yes'?'Yes':'No',cls=c.crit?(a=='yes'?'rd':'ok'):na?'ne':(c.t=='sc'?a/c.s[0]:a=='yes'?1:0)>=.75?'ok':(c.t=='sc'?a/c.s[0]:a=='yes'?1:0)>=.4?'wn':'rd',ap=S.ap.find(p=>p.cid==cv.id&&p.cr==c.id);
return`<div class="crit"><b>${c.n} <span class="mu" style="font-weight:400">${c.crit?'no points':'weight '+c.w}</span></b><span><span class="b ${cls}">${l}</span> ${c.crit||na?'':`<b>${pts.toFixed(2)}</b><span class="mu">/${max.toFixed(2)}</span>`}</span>
<p>${r.t} <a class="ev" onclick="jump(${r.e})">Evidence: message ${r.e}</a>${na?' Reason: criterion not applicable under its N/A rule.':''}</p>
${r.ovr?`<p><span class="b wn">Reviewer: ${r.orig} → ${a}</span> ${r.ovr.why}</p>`:''}
<div class="row">${ap?`<span class="b ${ap.s=='pending'?'wn':'ok'}">Appeal ${ap.s}</span>`:`<button onclick="appeal('${cv.id}','${c.id}')">Appeal</button>`}</div></div>`}
function jump(i){const e=$('#m'+i);if(!e)return;document.querySelectorAll('.hl').forEach(x=>x.classList.remove('hl'));e.classList.add('hl');e.scrollIntoView({behavior:'smooth',block:'center'})}
function seek(i){toast('Audio moved to '+CV.find(x=>x.id==CID).m[i][1]);jump(i)}
function run(id){const m=$('#m');m.innerHTML=`<div class="card"><h3>Evaluating ${id}…</h3><div class="bar"><i id="pg" style="width:5%;transition:width 1.2s"></i></div><p class="mu">Applying "${AC().n}" (${AC().c.length} criteria)</p></div>`;setTimeout(()=>$('#pg').style.width='100%',50);setTimeout(()=>{S.ran[id]=1;sv();render();toast('Evaluation complete')},1300)}
// appeals
function appeal(cid,cr){const c=CV.find(x=>x.id==cid),cc=AC().c.find(x=>x.id==cr);md(`<h3>Appeal: ${cc.n}</h3><p class="mu">Original: ${res(c,cc).a}. ${res(c,cc).t}</p><label>Your comment</label><textarea id="ac" rows="4" placeholder="Explain why this score is wrong"></textarea><div class="row" style="margin-top:14px;justify-content:flex-end"><button onclick="md()">Cancel</button><button class="p" onclick="subm('${cid}','${cr}')">Submit appeal</button></div>`)}
function subm(cid,cr){const t=$('#ac').value.trim();if(!t){$('#ac').style.borderColor='var(--rd)';return}const c=CV.find(x=>x.id==cid),cc=AC().c.find(x=>x.id==cr);S.ap.push({id:'A'+(S.ap.length+1),cid,cr,comment:t,s:'pending',orig:res(c,cc).a,dt:'2026-11-07'});sv();md();render();toast('Appeal submitted')}
function md(h){$('#o').innerHTML=h?`<div class="modal"><div>${h}</div></div>`:''}
function ap(){const a=S.ap;return`<h2>Appeals & review</h2><p class="sub">Confirm or change the disputed score. The final score recalculates automatically.</p><div class="card tw"><table><tr><th>Appeal<th>Conversation<th>Criterion<th>Original<th>Comment<th>Status<th></tr>${a.map((p,i)=>{const cc=AC().c.find(x=>x.id==p.cr);return`<tr><td>${p.id}<td>${p.cid}<td>${cc?cc.n:p.cr}<td>${p.orig}<td>${p.comment}<td><span class="b ${p.s=='pending'?'wn':'ok'}">${p.s}</span><td>${p.s=='pending'?`<button class="p" onclick="rv(${i})">Review</button>`:`${p.nv}`}</tr>`}).join('')||'<tr><td colspan=7 class="mu">No appeals yet. Open an evaluation and appeal a criterion.</tr>'}</table></div>`}
function rv(i){const p=S.ap[i],c=CV.find(x=>x.id==p.cid),cc=AC().c.find(x=>x.id==p.cr),r=res(c,cc),opts=cc.t=='sc'?cc.s:cc.crit||cc.t=='yn'?['yes','no',...(cc.na?['na']:[])]:[];
md(`<h3>Review ${p.id}: ${cc.n}</h3><p class="mu">Score before: <b>${fin(c).tot}</b> · AI answer: ${p.orig}</p><div class="msg client"><small>Appeal comment</small>${p.comment}</div><div class="msg"><small>Evidence message ${r.e}</small>${c.m[r.e]?c.m[r.e][2]:''}</div><label>New score</label><select id="nv">${opts.map(o=>`<option ${o==p.orig?'selected':''}>${o}</option>`)}</select><label>Reason (required)</label><textarea id="rw" rows="3"></textarea><div class="row" style="margin-top:14px;justify-content:flex-end"><button onclick="md()">Cancel</button><button class="p" onclick="dec(${i})">Confirm decision</button></div>`)}
function dec(i){const why=$('#rw').value.trim();if(!why){$('#rw').style.borderColor='var(--rd)';return}const p=S.ap[i],cc=AC().c.find(x=>x.id==p.cr);let v=$('#nv').value;if(cc.t=='sc')v=+v;const old=fin(CV.find(x=>x.id==p.cid)).tot;(S.ov[p.cid]=S.ov[p.cid]||{})[p.cr]={v,why};p.s='resolved';p.nv=v;sv();md();const nw=fin(CV.find(x=>x.id==p.cid)).tot;render();toast(`Score recalculated: ${old} → ${nw}`)}
// checklists
function cl(){if(EDIT)return ed();return`<div class="row sp"><div><h2>Checklists</h2><p class="sub">Only the active checklist is used for evaluation.</p></div><button class="p" onclick="newCl()">New checklist</button></div><div class="grid g2">${S.cl.map(x=>`<div class="card"><div class="row sp"><b>${x.n}</b>${x.id==S.act?'<span class="b ok">Active</span>':''}</div><p class="mu">${x.d} · ${x.c.length} criteria</p><div class="row"><button class="p" onclick="EDIT='${x.id}';render()">Edit</button><button onclick="S.act='${x.id}';sv();render()">Activate</button><button onclick="dup('${x.id}')">Duplicate</button>${S.cl.length>1?`<button class="d" onclick="del('${x.id}')">Delete</button>`:''}</div></div>`).join('')}</div>`}
const CUR=()=>S.cl.find(x=>x.id==EDIT);
function newCl(){const id='k'+Date.now();S.cl.push({id,n:'New checklist',d:'',lg:'All',tp:'Chat',c:[]});EDIT=id;sv();render()}
function dup(id){const x=S.cl.find(y=>y.id==id);S.cl.push({...JSON.parse(JSON.stringify(x)),id:'k'+Date.now(),n:x.n+' (copy)'});sv();render()}
function del(id){S.cl=S.cl.filter(x=>x.id!=id);if(S.act==id)S.act=S.cl[0].id;sv();render()}
function ed(){const x=CUR(),tw=x.c.reduce((s,c)=>s+(c.crit?0:c.w),0);return`<div class="row sp"><h2>Edit checklist</h2><button onclick="EDIT=null;sv();render();toast('Checklist saved')" class="p">Save and close</button></div>
<div class="card"><label>Name</label><input value="${x.n}" oninput="CUR().n=this.value"><label>Description</label><input value="${x.d}" oninput="CUR().d=this.value"></div>
<div class="card" style="margin-top:12px"><div class="row sp"><h3>Criteria</h3><span class="b ${tw==100?'ok':'rd'}">Total weight ${tw}${tw==100?'':' — must equal 100'}</span></div><div class="bar" style="margin-bottom:8px"><i style="width:${Math.min(tw,100)}%;background:${tw==100?'var(--ok)':'var(--rd)'}"></i></div>
${x.c.map((c,i)=>`<div class="crit"><span><b>${c.n}</b> <span class="mu">${c.crit?'critical flag':c.t=='sc'?'scale '+c.s.join('/'):'Yes/No'} · weight ${c.w}${c.na?' · N/A allowed':''}</span><br><span class="mu">${c.d}</span></span><span class="row"><button onclick="mv(${i},-1)">↑</button><button onclick="mv(${i},1)">↓</button><button onclick="ce(${i})">Edit / replace</button><button class="d" onclick="CUR().c.splice(${i},1);render()">Delete</button></span></div>`).join('')}
<button style="margin-top:10px" onclick="ce(-1)">Add criterion</button></div>`}
function mv(i,d){const c=CUR().c,j=i+d;if(j<0||j>=c.length)return;[c[i],c[j]]=[c[j],c[i]];render()}
function ce(i){const c=i<0?{id:'n'+Date.now(),n:'',d:'',t:'yn',w:10,na:false}:CUR().c[i];md(`<h3>${i<0?'Add':'Edit'} criterion</h3><label>Name</label><input id="en" value="${c.n}"><label>Description</label><input id="ed" value="${c.d}"><label>Answer type</label><select id="et" onchange="$('#es').parentElement.style.display=this.value=='sc'?'block':'none'"><option value="yn" ${c.t=='yn'?'selected':''}>Yes / No</option><option value="sc" ${c.t=='sc'?'selected':''}>Numeric scale</option></select>
<div style="display:${c.t=='sc'?'block':'none'}"><label>Scale steps, highest first</label><input id="es" value="${(c.s||[10,5,0]).join(',')}"></div><label>Weight</label><input id="ew" type="number" value="${c.w}"><div class="row" style="margin-top:10px"><label><input id="ena" type="checkbox" ${c.na?'checked':''} style="width:auto"> N/A allowed</label><label><input id="ec" type="checkbox" ${c.crit?'checked':''} style="width:auto"> Critical violation flag</label></div>
<div class="row" style="margin-top:14px;justify-content:flex-end"><button onclick="md()">Cancel</button><button class="p" onclick="cs(${i},'${c.id}')">Save criterion</button></div>`)}
function cs(i,id){const o={id,n:$('#en').value||'Untitled',d:$('#ed').value,t:$('#et').value,w:+$('#ew').value||0,na:$('#ena').checked,crit:$('#ec').checked};if(o.t=='sc')o.s=$('#es').value.split(',').map(Number).filter(n=>!isNaN(n));if(o.crit)o.w=0;if(i<0)CUR().c.push(o);else CUR().c[i]=o;md();sv();render()}
function st(){return`<h2>Settings</h2><p class="sub">Visual mockup only.</p><div class="grid g2"><div class="card"><h3>Evaluation languages</h3><p>Russian, Kazakh and English are enabled.</p></div><div class="card"><h3>AI evaluation</h3><p class="mu">Model: not connected (frontend simulation).</p></div><div class="card"><h3>Cost tracking</h3><p class="mu">Estimated cost per evaluation: set when a model is connected.</p></div><div class="card"><h3>Demo data</h3><button class="d" onclick="localStorage.removeItem('cqa1');S=load();EDIT=null;render()">Reset demo data</button></div></div>`}
render();
</script></body></html>
